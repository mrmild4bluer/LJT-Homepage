# Site settings
title: Junteng Liu
name: Junteng Liu
description: "Personal website of Junteng Liu, first-year PhD candidate at HKUST NLP Group."
url: "https://mrmild4bluer.github.io"
baseurl: "/LJT-Homepage"

# Owner/author information
owner:
  name: "Junteng Liu"
  avatar: "avatar.png"
  bio: "First-year PhD candidate at HKUST NLP Group. Research on natural language processing and machine learning."
  location: "Hong Kong"
  email: "jliugi@connect.ust.hk"
  googlescholar: "https://scholar.google.com/citations?hl=en&user=tbK9jl4AAAAJ&view_op=list_works&sortby=pubdate"
  github: "Vicent0205"
  twitter: "junteng88716710"

# Conversion
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false

# Markdown Processors
kramdown:
  math_engine: mathjax
  syntax_highlighter: rouge

# Plugins (previously gems:)
plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jekyll-include-cache

# Skin
minimal_mistakes_skin: "default"

# Site Author
author:
  name: "Junteng Liu"
  avatar: "avatar.png"
  bio: "First-year PhD candidate at HKUST NLP Group."
  location: "Hong Kong"
  email: "jliugi@connect.ust.hk"
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/Vicent0205"
    - label: "Google Scholar"
      icon: "ai ai-google-scholar"
      url: "https://scholar.google.com/citations?hl=en&user=tbK9jl4AAAAJ&view_op=list_works&sortby=pubdate"
    - label: "Twitter"
      icon: "fab fa-fw fa-twitter"
      url: "https://twitter.com/junteng88716710"

# Defaults
defaults:
  # _pages
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "single"
      author_profile: true
  # _posts
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "single"
      author_profile: true
  # _publications
  - scope:
      path: ""
      type: "publications"
    values:
      layout: "single"
      author_profile: true
  # _talks
  - scope:
      path: ""
      type: "talks"
    values:
      layout: "single"
      author_profile: true

# Outputting
permalink: /:categories/:title/
paginate: 5
paginate_path: /page:num/

# Site Search
search: true

# Reading
words_per_minute: 200

# Comments
comments:
  provider: ""

# Exclude from processing
exclude:
  - /[A-Z]*
  - /vendor
  - /node_modules
  - /Gemfile
  - /Gemfile.lock
  - /package.json
  - /README.md
  - /LICENSE
